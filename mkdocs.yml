site_name: IE105 | Project Hub
site_description: Tài liệu đề tài Tìm hiểu Backdoor Attack trong tấn công mô hình
site_url: https://ie105.github.io/project-hub/

theme:
  name: material
  language: vi

plugins:
  - search:
      lang: vi

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Trang chủ: index.md
